[package]
name = "agentop"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "A TUI process inspector for Claude Code and OpenAI Codex CLI — like top for AI coding agents"
license = "MIT"
repository = "https://github.com/leboiko/claude-codex-pid-inspector"
keywords = ["tui", "process", "claude", "codex", "monitor"]
categories = ["command-line-utilities"]

[[bin]]
name = "agentop"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.38"
color-eyre = "0.6"
strum = { version = "0.28", features = ["derive"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
dirs = "6.0.0"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["yaml"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

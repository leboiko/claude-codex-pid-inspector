# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

# ---- Advisories ---------------------------------------------------------------

[advisories]
# Deny crates with known security vulnerabilities.
version = 2
yanked = "deny"
unmaintained = "deny"
unsound = "warn"

# ---- Licenses -----------------------------------------------------------------

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
# Reject anything not in the allow list.
deny = []
# Treat unlicensed crates as an error.
unlicensed = "deny"
# Warn on copyleft licenses that snuck in via transitive deps.
copyleft = "warn"
# Allow dual-licensed crates where at least one license is in the allow list.
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8

# ---- Bans ---------------------------------------------------------------------

[bans]
# Deny multiple versions of the same crate above threshold.
multiple-versions = "warn"
# Wildcards in Cargo.toml are a red flag.
wildcards = "deny"
# Highlight when features enable additional deps.
highlight = "all"

deny = [
    # Prefer rustls; openssl-sys pulls in a large C dependency.
    { name = "openssl-sys", reason = "use rustls instead of openssl" },
    { name = "openssl", reason = "use rustls instead of openssl" },
    { name = "native-tls", reason = "use rustls instead of native-tls" },
]

skip = []
skip-tree = []

# ---- Sources ------------------------------------------------------------------

[sources]
# Only allow crates.io as a registry source.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

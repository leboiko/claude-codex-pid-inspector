name: Deploy docs site

on:
  push:
    branches: [master]
    paths:
      - "book/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: Install mdBook
        run: cargo install --locked --version ^0.4 mdbook

      - name: Guard against missing book directory
        run: |
          if [ ! -d book ]; then
            echo "::error::book/ not found — nothing to build"
            exit 1
          fi

      - name: Build site
        run: mdbook build book

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
